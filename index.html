<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Обклейка домов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button id="sidebar-toggle">&#9776;</button>
  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>📋 Обклейка домов</h1>
      <button id="sidebar-close">&times;</button>
    </div>

    <div class="section">
      <h2>Статистика</h2>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-dot dot-pending"></span>
          <span>Новые: <strong id="count-pending">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-planned"></span>
          <span>Обклеить: <strong id="count-planned">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-active"></span>
          <span>Обклеено: <strong id="count-active">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-expired"></span>
          <span>Готовы снова: <strong id="count-expired">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-excluded"></span>
          <span>Исключены: <strong id="count-excluded">0</strong></span>
        </div>
        <div class="stat-item">
          <span>Всего: <strong id="count-total">0</strong></span>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Настройки</h2>
      <label>
        Период паузы (дней):
        <input type="number" id="cooldown-days" value="30" min="1" max="365" />
      </label>
    </div>

    <div class="section">
      <h2>Фильтр</h2>
      <div class="filter-buttons">
        <button class="btn-filter active" data-filter="all">Все</button>
        <button class="btn-filter" data-filter="pending">Новые</button>
        <button class="btn-filter" data-filter="planned">Обклеить</button>
        <button class="btn-filter" data-filter="active">Обклеено</button>
        <button class="btn-filter" data-filter="expired">Готовы</button>
        <button class="btn-filter" data-filter="excluded">Исключены</button>
      </div>
    </div>

    <div class="section">
      <h2>Действия</h2>
      <button id="btn-export" class="btn">💾 Экспорт данных</button>
      <button id="btn-import" class="btn">📂 Импорт данных</button>
      <input type="file" id="file-import" accept=".json" style="display:none" />
    </div>

    <div class="section tips">
      <p><strong>Подсказки:</strong></p>
      <p>🖱 Клик по карте — добавить дом</p>
      <p>🖱 Клик по маркеру — отметить обклейку / удалить</p>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
