<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Обклейка домов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=36" />
</head>
<body>
  <div id="toast"></div>
  <button id="sidebar-toggle">&#9776;</button>
  <button id="btn-locate" title="Моё местоположение">&#8982;</button>
  <div id="search-bar">
    <input id="search-input" type="search" placeholder="Поиск дома..." autocomplete="off" />
    <div id="search-results"></div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>📋 Обклейка домов</h1>
      <span class="version">v41</span>
      <button id="sidebar-close">&times;</button>
    </div>

    <div class="section">
      <h2>Статистика</h2>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-dot dot-planned"></span>
          <span>Обклеить: <strong id="count-planned">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-active"></span>
          <span>Обклеено: <strong id="count-active">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-commented"></span>
          <span>Закомментировано: <strong id="count-commented">0</strong></span>
        </div>
        <div class="stat-item">
          <span class="stat-dot dot-excluded"></span>
          <span>Исключены: <strong id="count-excluded">0</strong></span>
        </div>
        <div class="stat-item">
          <span>Всего: <strong id="count-total">0</strong></span>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Настройки</h2>
      <label>
        Период паузы (дней):
        <input type="number" id="cooldown-days" value="30" min="1" max="365" />
      </label>
    </div>

    <div class="section">
      <h2>Фильтр</h2>
      <div class="filter-buttons">
        <button class="btn-filter active" data-filter="all">Все</button>
        <button class="btn-filter" data-filter="planned">Обклеить</button>
        <button class="btn-filter" data-filter="active">Обклеено</button>
        <button class="btn-filter" data-filter="commented">Закомментировано</button>
        <button class="btn-filter" data-filter="excluded">Исключены</button>
      </div>
    </div>

    <div class="section">
      <h2>Действия</h2>
      <button id="btn-list" class="btn">📋 Список домов</button>
      <button id="btn-export" class="btn">💾 Экспорт данных</button>
      <button id="btn-import" class="btn">📂 Импорт данных</button>
      <button id="btn-offline" class="btn">🗺 Сохранить область офлайн</button>
      <div id="offline-status"></div>
      <input type="file" id="file-import" accept=".json" style="display:none" />
    </div>

    <div class="section tips">
      <p><strong>Подсказки:</strong></p>
      <p>🖱 Клик по карте — добавить дом</p>
      <p>🖱 Клик по маркеру — отметить обклейку / удалить</p>
    </div>
  </div>

  <div id="map"></div>

  <div id="house-list">
    <div id="house-list-header">
      <h2>Список домов</h2>
      <div id="list-sort">
        <button class="list-sort-btn active" data-sort="address">Адрес</button>
        <button class="list-sort-btn" data-sort="date">Дата</button>
        <button class="list-sort-btn" data-sort="status">Статус</button>
      </div>
      <button id="list-close">&times;</button>
    </div>
    <div id="list-filters" class="filter-buttons">
      <button class="btn-filter active" data-filter="all">Все</button>
      <button class="btn-filter" data-filter="planned">Обклеить</button>
      <button class="btn-filter" data-filter="active">Обклеено</button>
      <button class="btn-filter" data-filter="commented">Закомментировано</button>
      <button class="btn-filter" data-filter="excluded">Исключены</button>
    </div>
    <div id="house-list-content">
      <div class="list-empty">Нет домов</div>
    </div>
  </div>

  <div id="comment-dialog">
    <div id="comment-dialog-inner">
      <textarea id="comment-textarea" placeholder="Комментарий" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></textarea>
      <div id="comment-dialog-actions">
        <button id="comment-save" class="popup-btn popup-btn-done">Сохранить</button>
        <button id="comment-cancel" class="popup-btn popup-btn-exclude">Отмена</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js?v=41"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
